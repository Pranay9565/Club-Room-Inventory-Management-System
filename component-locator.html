<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Component Locator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14161a;
    --panel: #1b1e24;
    --panel-raised: #22262e;
    --line: #2c313a;
    --text: #eceef0;
    --text-dim: #9aa1ab;
    --text-faint: #656c76;
    --amber: #e8a33d;
    --amber-dim: #6b5324;
    --green: #6fcf97;
    --red: #d97467;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, #21252c 0%, var(--bg) 60%);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:48px 20px 80px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  /* header */
  header{margin-bottom:36px;}
  .kicker{
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    color:var(--amber);
    letter-spacing:0.02em;
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
  }
  .kicker .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 8px 1px rgba(232,163,61,0.7);
  }
  h1{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:clamp(26px,5vw,34px);
    margin:0 0 8px;
    letter-spacing:-0.01em;
  }
  header p{
    color:var(--text-dim);
    font-size:15px;
    line-height:1.55;
    margin:0;
    max-width:56ch;
  }

  /* search */
  .search-shell{
    position:relative;
    margin-top:28px;
  }
  .search-shell input{
    width:100%;
    background:var(--panel);
    border:1.5px solid var(--line);
    border-radius:10px;
    color:var(--text);
    font-family:'JetBrains Mono',monospace;
    font-size:17px;
    padding:16px 46px 16px 46px;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .search-shell input::placeholder{color:var(--text-faint);}
  .search-shell input:focus{
    border-color:var(--amber-dim);
    box-shadow:0 0 0 3px rgba(232,163,61,0.12);
  }
  .search-icon{
    position:absolute;left:16px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;color:var(--text-faint);pointer-events:none;
  }
  .clear-btn{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:var(--text-faint);
    font-family:'JetBrains Mono',monospace;font-size:13px;
    cursor:pointer;padding:6px 8px;border-radius:6px;
    display:none;
  }
  .clear-btn:hover{color:var(--text);background:var(--panel-raised);}

  .meta-row{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:12px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--text-faint);
  }

  /* results */
  #results{margin-top:20px;display:flex;flex-direction:column;gap:10px;}

  .result-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px 18px;
    display:flex;
    align-items:center;
    gap:16px;
    animation:fadeIn .18s ease both;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:none;}}

  .cupboard-badge{
    flex:0 0 auto;
    width:52px;height:52px;
    border-radius:9px;
    background:linear-gradient(160deg, var(--panel-raised), #191c22);
    border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;
  }
  .cupboard-badge .num{
    font-size:20px;font-weight:700;color:var(--amber);line-height:1;
  }
  .cupboard-badge .lbl{
    font-size:8px;color:var(--text-faint);letter-spacing:0.06em;margin-top:3px;
  }

  .result-info{flex:1 1 auto;min-width:0;}
  .result-name{
    font-size:16px;font-weight:600;color:var(--text);
    margin-bottom:4px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .result-name mark{
    background:rgba(232,163,61,0.28);color:var(--amber);
    border-radius:3px;padding:0 1px;
  }
  .result-cat{
    font-size:13px;color:var(--text-dim);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  .result-tags{
    flex:0 0 auto;
    display:flex;flex-direction:column;align-items:flex-end;gap:6px;
  }
  .qty{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;color:var(--text-dim);
  }
  .qty b{color:var(--text);font-weight:600;}
  .used-by{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    padding:2px 8px;
    border-radius:20px;
    border:1px solid var(--line);
    color:var(--text-faint);
  }
  .used-by.common{color:var(--green);border-color:#2d4536;}
  .used-by.club{color:#7fb2e5;border-color:#2a3c4d;}
  .used-by.rover{color:#d99bd9;border-color:#3d2c42;}

  /* multi-location note */
  .also-in{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;color:var(--text-faint);
    padding:0 18px 2px;
    margin-top:-4px;
  }

  /* empty / idle states */
  .state-box{
    text-align:center;
    padding:56px 24px;
    color:var(--text-faint);
    font-size:14px;
    border:1px dashed var(--line);
    border-radius:10px;
    margin-top:20px;
  }
  .state-box .big{
    font-family:'JetBrains Mono',monospace;
    font-size:15px;color:var(--text-dim);
    margin-bottom:6px;
  }
  .state-box .hint{margin-top:14px;font-size:13px;}
  .state-box .hint span{
    font-family:'JetBrains Mono',monospace;
    color:var(--text-dim);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:5px;
    padding:1px 7px;
    margin:0 2px;
    cursor:pointer;
  }
  .state-box .hint span:hover{border-color:var(--amber-dim);color:var(--amber);}

  /* browse by cupboard */
  .browse{
    margin-top:56px;
    border-top:1px solid var(--line);
    padding-top:28px;
  }
  .browse-head{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:16px;
  }
  .browse-head h2{
    font-family:'JetBrains Mono',monospace;
    font-size:14px;font-weight:600;
    color:var(--text-dim);
    margin:0;
    letter-spacing:0.01em;
  }
  .cupboard-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(140px,1fr));
    gap:10px;
  }
  .cupboard-tile{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:9px;
    padding:12px 14px;
    cursor:pointer;
    transition:border-color .15s ease, transform .1s ease;
    text-align:left;
  }
  .cupboard-tile:hover{border-color:var(--amber-dim);transform:translateY(-1px);}
  .cupboard-tile .n{
    font-family:'JetBrains Mono',monospace;
    color:var(--amber);font-size:18px;font-weight:700;
  }
  .cupboard-tile .name{
    font-size:12px;color:var(--text-dim);
    margin-top:5px;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .cupboard-tile .cnt{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;color:var(--text-faint);margin-top:6px;
  }

  footer{
    text-align:center;
    margin-top:52px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-faint);
  }

  @media (max-width:480px){
    .result-card{flex-wrap:wrap;}
    .result-tags{flex-direction:row;align-items:center;}
  }
</style>
</head>

</div>

const input = document.getElementById('search');
const resultsEl = document.getElementById('results');
const resultCountEl = document.getElementById('resultCount');
const totalCountEl = document.getElementById('totalCount');
const clearBtn = document.getElementById('clearBtn');
const cupboardGrid = document.getElementById('cupboardGrid');

totalCountEl.textContent = ITEMS.length + ' items · 10 cupboards';

// build cupboard summary
const cupboards = {};
ITEMS.forEach(it => {
  if(!cupboards[it.cupboard_num]){
    cupboards[it.cupboard_num] = {num: it.cupboard_num, name: it.cupboard_name, count: 0};
  }
  cupboards[it.cupboard_num].count++;
});
const cupboardList = Object.values(cupboards).sort((a,b)=>a.num-b.num);

cupboardGrid.innerHTML = cupboardList.map(c => `
  <button class="cupboard-tile" data-cupboard="${c.num}">
    <div class="n">${String(c.num).padStart(2,'0')}</div>
    <div class="name">${escapeHtml(c.name)}</div>
    <div class="cnt">${c.count} items</div>
  </button>
`).join('');

cupboardGrid.querySelectorAll('.cupboard-tile').forEach(tile=>{
  tile.addEventListener('click', ()=>{
    const num = tile.getAttribute('data-cupboard');
    const catName = cupboards[num].name;
    input.value = '';
    renderResults(ITEMS.filter(i => String(i.cupboard_num) === num), '');
    window.scrollTo({top: 0, behavior:'smooth'});
    resultCountEl.textContent = `Cupboard ${num} — ${catName}`;
  });
});

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function highlight(text, q){
  if(!q) return escapeHtml(text);
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if(idx === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0,idx)) + '<mark>' + escapeHtml(text.slice(idx, idx+q.length)) + '</mark>' + escapeHtml(text.slice(idx+q.length));
}

function score(name, q){
  const n = name.toLowerCase();
  if(n === q) return 0;
  if(n.startsWith(q)) return 1;
  const wordBoundary = new RegExp('\\\\b' + q.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&'));
  if(wordBoundary.test(n)) return 2;
  if(n.includes(q)) return 3;
  return 4;
}

function groupByName(items){
  const map = new Map();
  items.forEach(it => {
    const key = it.name.toLowerCase();
    if(!map.has(key)) map.set(key, []);
    map.get(key).push(it);
  });
  return map;
}

function renderResults(matches, q){
  if(matches.length === 0){
    resultsEl.innerHTML = '';
    resultCountEl.textContent = '';
    if(q){
      resultsEl.innerHTML = `
        <div class="state-box">
          <div class="big">No match for "${escapeHtml(q)}"</div>
          <div>It might be listed under a different name, or it's not in this room's inventory.</div>
        </div>`;
    }
    return;
  }

  const grouped = groupByName(matches);
  resultCountEl.textContent = matches.length + (matches.length===1 ? ' match' : ' matches');

  let html = '';
  grouped.forEach((entries) => {
    const primary = entries[0];
    const others = entries.slice(1);
    const usedByClass = (primary.used_by || '').toLowerCase();
    html += `
      <div class="result-card">
        <div class="cupboard-badge">
          <div class="num">${String(primary.cupboard_num).padStart(2,'0')}</div>
          <div class="lbl">CUPBD</div>
        </div>
        <div class="result-info">
          <div class="result-name">${highlight(primary.name, q)}</div>
          <div class="result-cat">${escapeHtml(primary.cupboard_name)}</div>
        </div>
        <div class="result-tags">
          <div class="qty">qty <b>${escapeHtml(String(primary.count))}</b></div>
          ${primary.used_by ? `<div class="used-by ${usedByClass}">${escapeHtml(primary.used_by)}</div>` : ''}
        </div>
      </div>`;
    if(others.length){
      html += `<div class="also-in">also in cupboard${others.length>1?'s':''} ${others.map(o=>o.cupboard_num).join(', ')} (${others.map(o=>o.cupboard_name).join(' · ')})</div>`;
    }
  });
  resultsEl.innerHTML = html;
}

function doSearch(){
  const q = input.value.trim().toLowerCase();
  clearBtn.style.display = q ? 'block' : 'none';

  if(!q){
    resultsEl.innerHTML = `
      <div class="state-box">
        <div class="big">Start typing to search</div>
        <div>Try: <span data-fill="Arduino">Arduino</span><span data-fill="resistor">resistor</span><span data-fill="GPS">GPS</span><span data-fill="motor">motor</span></div>
      </div>`;
    resultCountEl.textContent = '';
    resultsEl.querySelectorAll('[data-fill]').forEach(el=>{
      el.addEventListener('click', ()=>{ input.value = el.getAttribute('data-fill'); doSearch(); input.focus(); });
    });
    return;
  }

  const matches = ITEMS
    .filter(it => it.name.toLowerCase().includes(q))
    .sort((a,b) => score(a.name, q) - score(b.name, q) || a.name.localeCompare(b.name));

  renderResults(matches, q);
}

input.addEventListener('input', doSearch);
clearBtn.addEventListener('click', ()=>{ input.value=''; doSearch(); input.focus(); });

doSearch();
